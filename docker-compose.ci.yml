# CI only (scripts/ci/smoke_test.sh): no Datadog Agent.
# With DD_AGENT_HOST=datadog-agent, every DogStatsD send waits on a failing DNS lookup
# (~10ms on a GitHub runner) -> a 1000-record batch takes ~10s, a 6h backfill takes ~5 min.
services:
  api:
    environment:
      DD_AGENT_HOST: localhost
  simulator:
    environment:
      DD_AGENT_HOST: localhost
  worker:
    environment:
      DD_AGENT_HOST: localhost
