name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)  # required check name in the main ruleset: do not rename
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff and vulture
        run: pip install "$(grep '^ruff==' requirements-dev.txt)" "$(grep '^vulture==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format github app tests

      - name: Format
        run: ruff format --check app tests

      # Config in pyproject.toml [tool.vulture]; false positives go in scripts/ci/vulture_whitelist.py.
      - name: Dead code
        run: vulture

  test:
    name: Tests (MongoDB 7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Test fixture drops collections: always a throwaway DB, never Atlas.
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: shrimpwatch_test
      DD_TRACE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Single-node replica set (Change Streams need one). A service container cannot take mongod arguments.
      - name: Start MongoDB 7 replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            state=$(docker exec mongodb mongosh --quiet --eval "try { rs.status().members[0].stateStr } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); 'INITIATED' }" 2>/dev/null || true)
            echo "replica set: ${state:-starting}"
            [ "$state" = "PRIMARY" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest -v -rs --cov --cov-report=term --cov-report=xml tests/

      - name: Coverage summary
        if: always()
        run: |
          [ -f .coverage ] || exit 0
          { echo '### Coverage'; echo '```'; coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Boot stack and check data flow
        run: scripts/ci/smoke_test.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
