name: AI Review (DeepSeek)

# Advisory AI review (does not block merge): DeepSeek reads the PR diff and posts 1 comment.
# Runs when a PR is opened; re-run with a `/ci-review deepseek` comment (owner/member/collaborator only).
# Never checks out or runs PR code: the script and review rules always come from the base branch (the PR's base commit
# or main), and the diff comes from the API. PRs from forks have no secrets -> skipped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/ci-review deepseek'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted code: a PR cannot change the script/rules and then run them with DEEPSEEK_API_KEY
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci/ai_review.py
            .github/copilot-instructions.md
          sparse-checkout-cone-mode: false

      - name: Check reviewer exists on base
        id: base
        run: |
          if [ -f scripts/ci/ai_review.py ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::scripts/ci/ai_review.py is not on the base branch yet; skipping"; fi

      - uses: actions/setup-python@v5
        if: steps.base.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Review with DeepSeek
        if: steps.base.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_EFFORT: ${{ vars.DEEPSEEK_EFFORT }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python scripts/ci/ai_review.py
