name: CD

# Only build and push the image when CI on main is green: lint, tests and smoke test all passed for this exact commit.
# Image: ghcr.io/<owner>/shrimpwatch, tags `sha-<7 chars>` and `latest`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Publish image (GHCR)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI checked, not the current head of main
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # metadata-action's type=sha reads github.sha (head of main), not the commit CI ran on
      # `latest` only if this commit is still the head of main: a CI re-run for an old commit must not overwrite `latest`
      - id: rev
        run: |
          echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is_tip=$([ "$tip" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ steps.rev.outputs.short }}
            type=raw,value=latest,enable=${{ steps.rev.outputs.is_tip }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Image published'
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
